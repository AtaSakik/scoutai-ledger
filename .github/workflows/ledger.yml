name: ledger
on:
  schedule:
    - cron: "7 * * * *"        # hourly; the API caches the commitments for 5 minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ledger-writes
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # the tip when this job starts, not when it was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentimestamps-client>=0.7,<0.8"
      - run: python tools/snapshot.py
      - name: commit
        run: |
          git config user.name "scoutai-ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger certs
          if ! git diff --cached --quiet; then
            git commit -m "ledger $(date -u +%Y-%m-%dT%H:%MZ)"
            bash tools/push.sh
          fi
