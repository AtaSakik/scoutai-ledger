name: upkeep
on:
  schedule:
    - cron: "17 5 * * *"       # daily: re-verify yesterday's RFC 3161 tokens, upgrade OTS proofs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ledger-writes
  cancel-in-progress: false
jobs:
  upkeep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentimestamps-client>=0.7,<0.8"
      - run: python tools/upkeep.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
      - name: commit upgraded proofs
        if: always()
        run: |
          git config user.name "scoutai-ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger
          if ! git diff --cached --quiet; then
            git commit -m "upgrade OpenTimestamps proofs $(date -u +%Y-%m-%d)"
            git push
          fi
