name: open-data
on:
  schedule:
    - cron: "13 6 * * 1"       # weekly: every resolved prediction as CSV (ScoutAI roadmap L3)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ledger-writes
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # the tip when this job starts, not when it was queued
      - name: fetch
        run: |
          code=$(curl -sS -A "scoutai-ledger/1.0 (+https://github.com/AtaSakik/scoutai-ledger)" \
                 -o data/predictions.csv.new -w '%{http_code}' https://api.atasakik.com/predictions/export)
          if [ "$code" = "404" ]; then echo "::warning::export not deployed yet"; rm -f data/predictions.csv.new; exit 0; fi
          test "$code" = "200"
          mv data/predictions.csv.new data/predictions.csv
      - name: commit
        run: |
          git config user.name "scoutai-ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "open data $(date -u +%Y-%m-%d)"
            bash tools/push.sh
          fi
